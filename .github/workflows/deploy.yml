# sporePrint deploy — Zola build → GitHub Pages
# The membrane SEEMS static but the build is alive.
# Incremental: push → build (5s) → deploy → verify.
# spore-validate runs separately as a non-blocking check.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv zola /usr/local/bin/

      - name: Build with Zola
        run: zola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CDN propagation
        run: sleep 15

      - name: Verify science pages respond
        run: |
          FAILURES=0
          for path in "/" "/science/" "/science/01-anderson-qs/" "/science/119-the-gaia-institute/" "/architecture/"; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://primals.eco${path}")
            if [[ "$STATUS" == "200" ]]; then
              echo "OK   $path ($STATUS)"
            else
              echo "FAIL $path ($STATUS)"
              FAILURES=$((FAILURES + 1))
            fi
          done
          echo "Verified $(( 5 - FAILURES ))/5 pages"

  validate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/spore-validate/target
          key: spore-validate-${{ hashFiles('crates/spore-validate/Cargo.lock') }}
      - name: Validate entity registry (non-blocking)
        run: |
          cargo build --release --manifest-path crates/spore-validate/Cargo.toml && \
          ./crates/spore-validate/target/release/spore-validate --root . validate --check || \
          echo "::warning::spore-validate failed — deploy continues anyway"
